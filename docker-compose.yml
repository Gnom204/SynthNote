services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthnote}
      POSTGRES_DB: ${POSTGRES_DB:-synthnote}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthnote} -d ${POSTGRES_DB:-synthnote}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - synthnote

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars-long-key}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synthnote}:${POSTGRES_PASSWORD:-synthnote}@db:5432/${POSTGRES_DB:-synthnote}
      POSTGRES_USER: ${POSTGRES_USER:-synthnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthnote}
      POSTGRES_DB: ${POSTGRES_DB:-synthnote}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      UPLOAD_DIR: /app/uploads
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:8080","http://127.0.0.1:8080","http://localhost","http://127.0.0.1"]'
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1",
      ]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - synthnote_uploads:/app/uploads
    networks:
      - synthnote

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - synthnote

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    command: ["alembic", "upgrade", "head"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-chars-long-key}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-synthnote}:${POSTGRES_PASSWORD:-synthnote}@db:5432/${POSTGRES_DB:-synthnote}
      POSTGRES_USER: ${POSTGRES_USER:-synthnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthnote}
      POSTGRES_DB: ${POSTGRES_DB:-synthnote}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - synthnote
    restart: "no"

volumes:
  postgres_data:
  synthnote_uploads:

networks:
  synthnote:
    driver: bridge
